# No deviceSelector: LVMS claims every disk that is blank and unpartitioned,
# which on this node is only the extra gp3 volume terraform attaches as /dev/sdf
# (it shows up as /dev/nvme1n1). The root disk has partitions, so LVMS excludes
# it -- confirmed on a live cluster, where status.deviceClassStatuses listed
# nvme0n1 and every partition under "excluded". install-lvms.sh prints the
# devices LVMS actually took so that is checked, not assumed.
#
# `default: true` here does NOT make lvms-vg1 the default StorageClass while
# another default exists (LVMS leaves is-default-class "false"). install-lvms.sh
# deals with that; see docs/storage.md.
apiVersion: lvm.topolvm.io/v1alpha1
kind: LVMCluster
metadata:
  name: lvmcluster
  namespace: openshift-storage
spec:
  storage:
    deviceClasses:
      - name: vg1
        default: true
        fstype: xfs
        thinPoolConfig:
          name: thin-pool-1
          sizePercent: 90
          overprovisionRatio: 10
