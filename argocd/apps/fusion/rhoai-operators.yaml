apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhoai-operators
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://git.example.internal/REPLACE_ME/openshift-sno-ai.git # PLACEHOLDER
    targetRevision: main # PLACEHOLDER: pin a tag or SHA for Fusion
    path: charts/rhoai-operators
    helm:
      releaseName: rhoai-operators
      valueFiles:
        - ../values/fusion.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy: # manual
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: operators.coreos.com
      kind: Subscription
      jsonPointers:
        - /status
        - /spec/config # UNVERIFIED: only if RHOAI/OLM mutates it
